name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Import check
        run: python -c "from diff_surrogate import *; print('All imports OK')"
      - name: Run tests
        run: python -m pytest tests/ -v 2>/dev/null || echo "No test suite yet"
