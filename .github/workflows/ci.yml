name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .[dev]
      - run: ruff check diff_surrogate tests
      - run: ruff format --check diff_surrogate tests
      - run: pytest -v

  flagship-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: make flagship-ci
      - name: Validate output JSON
        run: |
          python3 -c "
          import json, sys
          p = 'benchmarks/results/codesign_benchmark_results.json'
          with open(p) as f:
              data = json.load(f)
          assert 'config' in data, 'missing config'
          assert 'benchmarks' in data, 'missing benchmarks'
          assert len(data['benchmarks']) >= 1, 'no benchmark results'
          print('OK: flagship output JSON valid')
          "

  # Cross-repo integration: install all 4 repos and run compatibility tests.
  # Single Python version to save CI minutes.
  cross-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diff-surrogate
        run: pip install -e .[dev]
      - name: Install DiffNano
        run: pip install "diffnano @ git+https://github.com/OpenLithoHub/DiffNano.git"
      - name: Install DiffCFD
        run: pip install "diffcfd @ git+https://github.com/OpenLithoHub/DiffCFD.git"
      - name: Install OpenLithoHub (core)
        run: pip install "openlithohub @ git+https://github.com/OpenLithoHub/OpenLithoHub.git"
      - name: Run cross-repo compatibility tests
        run: pytest tests/test_cross_repo_compat.py -v

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scancode-toolkit
        run: pip install scancode-toolkit
      - name: Scan for copyleft licenses
        run: |
          scancode --license --copyright --only-findings --strip-root diff_surrogate/ > scancode-report.txt 2>&1 || true
          echo "--- Scan results ---"
          cat scancode-report.txt
          # Fail if any GPL/AGPL detected
          if grep -qiE '(GPL|AGPL|copyleft)' scancode-report.txt; then
            echo "::error::Copyleft license detected in source code"
            exit 1
          fi
          echo "No copyleft licenses found."
