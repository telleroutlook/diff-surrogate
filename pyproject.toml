[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-surrogate"
version = "0.2.0"
description = "Unified differentiable surrogate framework for physics simulations"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
    {name = "telleroutlook"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.0,<3.0",
    "numpy",
]

[project.urls]
Repository = "https://github.com/telleroutlook/diff-surrogate"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["diff_surrogate*"]

[tool.setuptools.package-data]
diff_surrogate = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "SIM", "PERF", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["diff_surrogate"]
ignore_missing_imports = true

[tool.pyright]
include = ["diff_surrogate"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]